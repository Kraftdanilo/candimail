# nginx.conf — Candimail derrière un reverse proxy HTTPS
#
# Deux options de certificat :
#   1. Let's Encrypt automatique via certbot (voir README)
#   2. Certificat manuel : remplace les chemins ssl_certificate ci-dessous
#
# Ce bloc redirige tout le HTTP vers HTTPS et transmet le bon protocole à Flask.

# --- Bloc HTTP : redirection vers HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name candimail.exemple.com;

    # Laisse passer le challenge ACME de certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste part en HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Bloc HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name candimail.exemple.com;

    # Certificats (gérés par certbot, ou tes propres fichiers)
    ssl_certificate     /etc/letsencrypt/live/candimail.exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candimail.exemple.com/privkey.pem;

    # Réglages TLS modernes
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pièces jointes PDF (Flask limite déjà à 20 Mo)
    client_max_body_size 25M;

    # Candimail écoute en local uniquement
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Transmet le vrai protocole et l'IP client à Flask
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Envois d'emails potentiellement longs (bulk) : pas de coupure
        proxy_read_timeout 300s;
    }
}
