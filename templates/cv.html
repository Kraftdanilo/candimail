<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon CV — Candimail</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <h1>📄 Mon CV</h1>
  <div class="row" style="margin:0">
    <a class="btn small" href="/app">← Retour à l'application</a>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Éditeur de CV</h2>
    <p class="help">Enregistré dans la base locale (une version par profil). Toutes les listes acceptent une ligne par élément.</p>

    <div class="grid">
      <div><label>Titre</label><input type="text" id="cv-titre"></div>
      <div><label>Nom</label><input type="text" id="cv-nom"></div>
      <div><label>Ville</label><input type="text" id="cv-ville"></div>
    </div>
    <div><label>Résumé</label><textarea id="cv-resume" rows="3"></textarea></div>

    <div class="grid" style="margin-top:14px">
      <div><label>Expériences (une par ligne)</label><textarea id="cv-experiences" rows="5"></textarea></div>
      <div><label>Formations (une par ligne)</label><textarea id="cv-formations" rows="5"></textarea></div>
      <div><label>Compétences (une par ligne)</label><textarea id="cv-competences" rows="5"></textarea></div>
      <div><label>Langues (une par ligne)</label><textarea id="cv-langues" rows="5"></textarea></div>
      <div><label>Références (une par ligne)</label><textarea id="cv-references" rows="5"></textarea></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btn-cv-save">💾 Enregistrer le CV</button>
      <button class="btn" id="btn-cv-reload">🔄 Recharger</button>
    </div>
  </section>

  <section class="panel">
    <h2>Aperçu</h2>
    <div id="cv-aperçu"></div>
  </section>
</main>

<footer class="app-footer">
  <span class="copyright">© {{ annee }} — Candimail · Licence MIT · {{ COPYRIGHT }}</span>
</footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const LISTS = ['experiences', 'formations', 'competences', 'langues', 'references'];

function collectCv() {
  const cv = {
    titre: $('cv-titre').value.trim(),
    resume: $('cv-resume').value.trim(),
    nom: $('cv-nom').value.trim(),
    ville: $('cv-ville').value.trim(),
  };
  for (const k of LISTS) {
    cv[k] = $('cv-' + k).value.split('\n').map(s => s.trim()).filter(Boolean);
  }
  return cv;
}

function fillCv(cv) {
  cv = cv || {};
  $('cv-titre').value = cv.titre || '';
  $('cv-resume').value = cv.resume || '';
  $('cv-nom').value = cv.nom || '';
  $('cv-ville').value = cv.ville || '';
  for (const k of LISTS) $('cv-' + k).value = (cv[k] || []).join('\n');
  apercu();
}

function apercu() {
  const cv = collectCv();
  const li = arr => (arr || []).map(s => '<li>' + s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) + '</li>').join('');
  $('cv-aperçu').innerHTML =
    '<h3 style="text-transform:uppercase">' + (cv.titre || 'CV') + '</h3>' +
    '<p><strong>' + (cv.nom || '—') + '</strong> · ' + (cv.ville || '—') + '</p>' +
    '<p>' + (cv.resume || '') + '</p>' +
    ['Expériences', 'Formations', 'Compétences', 'Langues', 'Références'].map((t, i) => {
      const k = LISTS[i];
      return (cv[k] || []).length ? '<h4>' + t + '</h4><ul>' + li(cv[k]) + '</ul>' : '';
    }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#cv-titre,#cv-resume,#cv-nom,#cv-ville,' + LISTS.map(k => '#cv-' + k).join(','))
    .forEach(el => el.addEventListener('input', apercu));
  $('btn-cv-reload').addEventListener('click', load);
  $('btn-cv-save').addEventListener('click', async () => {
    const d = await fetch('/api/cv', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cv: collectCv() }) }).then(r => r.json());
    if (d.ok !== false) { toast('CV enregistré', 'ok'); } else toast(d.error || 'Erreur', 'err');
  });
  async function load() {
    try {
      const d = await fetch('/api/cv').then(r => r.json());
      fillCv(d.cv);
    } catch (e) { /* page utilisable hors serveur */ }
  }
  load();
});

function toast(msg, kind = '') {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.className = 'toast show ' + kind;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
