<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable (404) — Candimail</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/brutalist.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh;
        margin:0; font-family:Arial, Helvetica, sans-serif; background:#F7F1E4;
        color:#43161C; }
  .box{ background:#fff; border:3px solid #43161C; box-shadow:8px 8px 0 #43161C;
        padding:40px 34px; width:min(520px, 92vw); text-align:center;
        border-top:8px solid #1E5AA8; }
  .code{ font-size:64px; font-weight:900; line-height:1; color:#1E5AA8; }
  h1{ font-size:20px; text-transform:uppercase; margin:14px 0 8px; }
  p{ font-size:14px; color:#544A3C; margin:0 0 26px; }
  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.b{ display:inline-block; padding:12px 22px; font-size:14px; font-weight:800;
       text-transform:uppercase; text-decoration:none; color:#43161C; background:#fff;
       border:2px solid #43161C; box-shadow:4px 4px 0 #43161C; }
  a.b.orange{ background:#1E5AA8; color:#fff; }
</style>
</head>
<body>
<div class="box">
 <div class="code">404</div>
 <h1>Page introuvable</h1>
 <p>La page que tu cherches n'existe pas ou a été déplacée.</p>
 <div class="actions">
    <a class="b orange" href="/">Retour à l'accueil</a>
    <a class="b" href="/login">Connexion</a>
 </div>
</div>
</body>
</html>
