<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historique — Candimail</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <h1>🕓 Historique</h1>
  <div class="row" style="margin:0">
    <a class="btn small" href="/app">← Retour</a>
    <button class="btn danger small" id="btn-vider">🗑 Vider</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Actions récentes</h2>
    <p class="help">Chaque action modifiable peut être annulée (ou refaite après annulation).</p>
    <div id="liste" style="margin-top:14px"></div>
  </section>
</main>

<footer class="app-footer">
  <span class="copyright">© {{ annee }} — Candimail · Licence MIT · {{ COPYRIGHT }}</span>
</footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c]));
let actions = [];

async function charger() {
  const d = await fetch('/api/historique').then(r => r.json());
  actions = d.actions || [];
  render();
}

function render() {
  const el = $('liste');
  if (!actions.length) { el.innerHTML = '<div class="empty-box">Aucune action enregistrée.</div>'; return; }
  el.innerHTML = actions.map(h => `
    <div class="list-item">
      <span class="tag">${esc(h.type)}</span>
      <span class="grow"><b>${esc(h.label)}</b><br><span class="help">${esc(h.date || '')}${h.undone ? ' — annulée' : ''}</span></span>
      ${h.undo || h.redo ? `<button class="btn small" data-id="${h.id}" data-undone="${h.undone ? '1' : '0'}">${h.undone ? '↻ Refaire' : '↩ Annuler'}</button>` : ''}
    </div>`).join('');
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  const url = b.dataset.undone === '1'
    ? `/api/historique/${b.dataset.id}/redo`
    : `/api/historique/${b.dataset.id}/undo`;
  const d = await fetch(url, { method: 'POST' }).then(r => r.json());
  alert(d.message || d.error || 'Erreur');
  charger();
});

$('btn-vider').addEventListener('click', async () => {
  if (!confirm("Effacer tout l'historique ? Les actions passées ne seront plus annulables.")) return;
  await fetch('/api/historique', { method: 'DELETE' });
  charger();
});

charger();
</script>
</body>
</html>
