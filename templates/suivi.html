<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des envois — Candimail</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <h1>◔ Suivi des envois</h1>
  <div class="row" style="margin:0">
    <a class="btn small" href="/app">← Retour</a>
    <a class="btn small" href="/api/export-csv">⬇ CSV</a>
    <a class="btn small" href="/api/export-excel">⬇ Excel</a>
  </div>
</header>

<main>

  <div class="stats">
    <div class="stat"><div class="n" id="st-total">0</div><div class="l">Total</div></div>
    <div class="stat acc"><div class="n" id="st-envoyes">0</div><div class="l">Envoyés</div></div>
    <div class="stat acc"><div class="n" id="st-repondus">0</div><div class="l">Réponses</div></div>
    <div class="stat"><div class="n" id="st-echecs">0</div><div class="l">Échecs</div></div>
    <div class="stat"><div class="n" id="st-bounces">0</div><div class="l">Bounces</div></div>
  </div>

  <section class="panel">
    <h2>Activité des 7 derniers jours</h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="panel">
    <h2>Journal</h2>
    <div class="search-bar">
      <input type="search" id="q" placeholder="Rechercher entreprise, email, erreur…">
      <select id="statut" style="width:auto">
        <option value="">Tous statuts</option>
        <option value="ok">Envoyé</option>
        <option value="err">Échec</option>
        <option value="replied">Répondu</option>
        <option value="bounce">Bounce</option>
      </select>
    </div>
    <table class="tbl">
      <thead>
        <tr><th>Entreprise</th><th>Email</th><th>Date</th><th>Statut</th><th>Détail</th><th>Réponse</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="help" id="compte-lignes" style="margin-top:8px"></p>
  </section>

</main>

<footer class="app-footer">
  <span class="copyright">© {{ annee }} — Candimail · Licence MIT · {{ COPYRIGHT }}</span>
</footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c]));
let items = [];

const STATUTS = {
  ok: ['Envoyé', ''], err: ['Échec', 'err'], replied: ['Répondu', ''], bounce: ['Bounce', 'err'],
};

async function charger() {
  const q = $('q').value.trim();
  const st = $('statut').value;
  const url = '/api/suivi/recherche?limite=200' + (q ? '&q=' + encodeURIComponent(q) : '') + (st ? '&statut=' + st : '');
  const d = await fetch(url).then(r => r.json());
  items = d.items || [];
  render();
}

async function chargerGlobal() {
  const d = await fetch('/api/suivi').then(r => r.json());
  if (!d.ok) return;
  $('st-total').textContent = d.total;
  $('st-envoyes').textContent = d.envoyes;
  $('st-repondus').textContent = d.repondus;
  $('st-echecs').textContent = d.echecs;
  $('st-bounces').textContent = d.bounces;
  const max = Math.max(1, ...(d.jours || []).map(j => j.total));
  $('chart').innerHTML = (d.jours || []).map(j =>
    `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center">
      <span style="font-size:10px">${j.total}</span>
      <div class="bar" style="height:${Math.round(100 * j.total / max)}%"></div>
      <span style="font-size:9px">${j.date.slice(8)}</span>
    </div>`).join('');
}

function render() {
  $('rows').innerHTML = items.map(l => {
    const [lib, cls] = STATUTS[l.statut] || ['—', ''];
    return `<tr>
      <td><b>${esc(l.company)}</b>${l.groupe_nom ? '<br><span style="font-size:10px">' + esc(l.groupe_nom) + '</span>' : ''}</td>
      <td>${esc(l.email)}</td>
      <td>${esc(l.date)}</td>
      <td><span class="tag ${cls}">${lib}</span></td>
      <td style="font-size:11px">${esc(l.erreur || l.bounce_raison || l.sujet_reponse || '')}</td>
      <td><button class="btn small" data-company="${esc(l.company)}" data-repondu="${l.repondu ? '0' : '1'}">${l.repondu ? '↔ Annuler' : '↔ Marquer'}</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6">Aucun envoi enregistré.</td></tr>';
  $('compte-lignes').textContent = `${items.length} ligne(s) affichée(s)`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-company]');
  if (!b) return;
  const d = await fetch('/api/mark-response', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ company: b.dataset.company, repondu: b.dataset.repondu === '1' }) }).then(r => r.json());
  if (d.ok) { await Promise.all([chargerGlobal(), charger()]); } else alert(d.error || 'Erreur');
});

$('q').addEventListener('input', charger);
$('statut').addEventListener('change', charger);
chargerGlobal();
charger();
</script>
</body>
</html>
